<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Onda C — mapa em frente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="run-shared.css" />
</head>
<body class="run-body">
  <div class="run-app variant-c" data-variant="c" data-desk="desk-c.html">
    <div class="run-map" aria-hidden="true">
      <div class="aisles"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <svg id="route-svg" class="route-svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="nodeGreen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6ad88a" />
            <stop offset="100%" stop-color="#2f9a55" />
          </linearGradient>
        </defs>
        <path id="route-dash" class="route-dash" d="" />
        <path id="route-solid" class="route-solid" d="" />
        <g id="route-nodes"></g>
      </svg>
      <div class="map-fade"></div>
    </div>

    <div class="run-top">
      <button type="button" class="btn-back" id="btn-back" aria-label="Parada anterior">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M15 5 L8 12 L15 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
      <p class="run-progress num" id="run-progress">6 de 18</p>
      <div class="overflow-menu">
        <button type="button" class="menu-trigger" id="menu-c" aria-label="Mais">⋯</button>
        <div class="overflow-pop" id="menu-c-pop">
          <button type="button" data-act="share">Compartilhar</button>
          <button type="button" data-act="separar">Separar</button>
          <button type="button" data-act="peek">Parada anterior</button>
        </div>
      </div>
    </div>

    <div class="run-hud">
      <p class="hud-qty num" id="hud-qty">7</p>
      <p class="hud-loc" id="hud-loc">B-03</p>
      <p class="hud-depois" id="hud-depois">depois B-09</p>
    </div>

    <button type="button" class="btn-feito" id="btn-feito">Feito</button>
    <div class="toast" id="run-toast" role="status"></div>
  </div>
  <script src="run.js"></script>
</body>
</html>
