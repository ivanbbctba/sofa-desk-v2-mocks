<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Onda B — papel arejado</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shared.css" />
  <link rel="stylesheet" href="run-shared.css" />
</head>
<body class="run-body">
  <div class="run-app variant-b" data-variant="b" data-desk="desk-b.html">
    <div class="run-map" aria-hidden="true">
      <div class="aisles"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <svg id="route-svg" class="route-svg" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice">
        <defs>
          <linearGradient id="nodeGreen" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#6ad88a" />
            <stop offset="100%" stop-color="#2f9a55" />
          </linearGradient>
          <clipPath id="hudClip">
            <rect x="-50" y="-40" width="490" height="620" />
          </clipPath>
        </defs>
        <g clip-path="url(#hudClip)">
          <path id="route-dash" class="route-dash" d="" />
          <path id="route-solid" class="route-solid" d="" />
          <g id="route-nodes"></g>
        </g>
      </svg>
      <div class="map-fade"></div>
    </div>

    <p class="run-progress num" id="run-progress">6 de 18</p>

    <button type="button" class="peek-edge" id="peek-edge" aria-label="Ver parada anterior">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M15 5 L8 12 L15 19" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </button>
    <div class="peek-chip" id="peek-chip"></div>

    <div class="run-hud">
      <p class="hud-qty num" id="hud-qty">7</p>
      <p class="hud-loc" id="hud-loc">B-03</p>
      <p class="hud-depois" id="hud-depois">depois B-09</p>
    </div>

    <button type="button" class="btn-share" data-act="share" aria-label="Compartilhar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
        <path d="M16 6 L12 2 L8 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M12 2 v13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </svg>
    </button>
    <button type="button" class="btn-feito" id="btn-feito">Feito</button>
    <div class="toast" id="run-toast" role="status"></div>
  </div>
  <script src="run.js"></script>
</body>
</html>
