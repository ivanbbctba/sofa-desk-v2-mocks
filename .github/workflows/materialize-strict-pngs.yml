name: materialize-strict-pngs
on:
  push:
    paths:
      - ".github/workflows/materialize-strict-pngs.yml"
      - "strict/*.b64"
jobs:
  decode:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Decode PNGs and clean probes
        run: |
          python3 - <<'PY'
          import base64, pathlib, struct
          pathlib.Path("strict").mkdir(exist_ok=True)
          for src in sorted(pathlib.Path("strict").glob("*.png.b64")):
              name = src.name[:-4]  # drop .b64
              raw = base64.b64decode("".join(src.read_text().split()))
              w, h = struct.unpack(">II", raw[16:24])
              assert raw[:8] == b"\x89PNG\r\n\x1a\n" and (w, h) == (390, 844), (name, w, h, len(raw))
              dest = pathlib.Path("strict") / name
              dest.write_bytes(raw)
              print("wrote", dest, w, h, len(raw))
          PY
          git config user.name "Ivan Beira"
          git config user.email "61988079+ivanbbctba@users.noreply.github.com"
          git add strict/strict-speak-stop1.png strict/strict-speak-stop2.png || true
          git rm -f --ignore-unmatch strict/_probe.png strict/_probe2.png strict/.keep
          git rm -f --ignore-unmatch .github/workflows/materialize-strict-pngs.yml
          git rm -f --ignore-unmatch strict/*.png.b64
          git status
          git commit -m "Add Strict Speak+Feito phone shots (390x844)"
          git push
